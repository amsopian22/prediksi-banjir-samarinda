name: Scheduled Data Update

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:  # Allow manual trigger

# Required permissions for pushing commits
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests pandas numpy openmeteo-requests requests-cache retry-requests duckdb
      
      - name: Fetch Open-Meteo weather data
        id: fetch_openmeteo
        continue-on-error: true
        run: |
          python scripts/fetch_data_headless.py
        env:
          TZ: Asia/Makassar
      
      - name: Fetch BMKG weather data (59 kelurahan)
        id: fetch_bmkg
        continue-on-error: true
        run: |
          python scripts/fetch_bmkg_data.py
        env:
          TZ: Asia/Makassar
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated weather data update (OpenMeteo + BMKG) [skip ci]"
            git push
          fi
